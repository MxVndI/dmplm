spring:
  application:
    name: diplom-test-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/diplom_tests}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    com.diplom: DEBUG

app:
  participant-service-url: ${PARTICIPANT_SERVICE_URL:http://localhost:8085}
  security:
    admin:
      username: ${TEST_SERVICE_ADMIN_USERNAME:admin}
      password: ${TEST_SERVICE_ADMIN_PASSWORD:Admin1234!}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: diplom-test-service
  server:
    port: 8081
