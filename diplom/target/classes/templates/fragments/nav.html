<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--/* ---- Shared Navigation Bar fragment ---- */-->
<nav th:fragment="navbar" class="navbar">
    <div class="container">
        <a th:href="@{/}" class="navbar-brand">Магазин</a>
        <ul class="navbar-links">
            <li><a th:href="@{/}">Главная</a></li>
            <li><a th:href="@{/products}">Товары</a></li>
            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/profile}">
                    Профиль: <span sec:authentication="name" style="font-weight:700"></span>
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/products}">
                    Админ <span class="nav-badge">А</span>
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/config-tests}">
                    A/B Тесты <span class="nav-badge" style="background:#a78bfa">Т</span>
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/notifications}">
                    Рассылка <span class="nav-badge" style="background:#0d9488">Р</span>
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/templates}">
                    Шаблоны <span class="nav-badge" style="background:#7c3aed">Ш</span>
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/demographics}">
                    Демография <span class="nav-badge" style="background:#b45309">Д</span>
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/metrics}">
                    Метрики <span class="nav-badge" style="background:#0f766e">М</span>
                </a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/cart}">
                    Корзина <span class="nav-badge" style="background:#7c2d12" id="cart-count-badge"
                        th:text="${_cartCount != null ? _cartCount : 0}">0</span>
                </a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/orders}">Заказы</a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/auth/logout}" method="post" style="margin:0">
                    <button type="submit" class="btn btn-outline" style="color:#cbd5e1;border-color:#475569">Выйти</button>
                </form>
            </li>
        </ul>
    </div>

    <!--/* Inject tracking context for main.js — never visible to the user */-->
    <script th:inline="javascript">
    window.__tracking = {
        userId:  /*[[${_trackUserId}]]*/ null,
        testId:  /*[[${_trackTestId}]]*/ null,
        variant: /*[[${_trackVariant}]]*/ null
    };
    </script>
</nav>

</body>
</html>
