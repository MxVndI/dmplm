<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мои заказы</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width:900px">
    <h1 class="page-title">Мои заказы</h1>

    <div th:if="${orders == null or #lists.isEmpty(orders)}" class="admin-section">
        <p class="text-muted">У вас пока нет заказов.</p>
        <a th:href="@{/products}" class="btn btn-primary">Перейти к товарам</a>
    </div>

    <div th:unless="${orders == null or #lists.isEmpty(orders)}" class="order-history">
        <div class="order-row" th:each="order : ${orders}"
             style="background:#fff;border-radius:.6rem;padding:1rem 1.2rem;margin-bottom:.75rem;box-shadow:0 1px 6px rgba(0,0,0,.06)">
            <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.5rem">
                <span class="badge"
                      th:classappend="${order.status == 'COMPLETED'} ? 'badge-active' : 'badge-inactive'"
                      th:text="${order.status == 'COMPLETED'} ? 'Выполнен' : ${order.status}">-</span>
                <span style="font-weight:800;color:#667eea" th:text="'$' + ${order.totalPrice}">$0</span>
                <span style="font-size:.82rem;color:#64748b"
                      th:text="${order.createdAt != null ? #temporals.format(order.createdAt,'dd.MM.yyyy HH:mm') : ''}">-</span>
                <span th:if="${order.variant != null}" class="badge" th:text="'Вариант ' + ${order.variant}">-</span>
                <span style="font-family:monospace;font-size:.8rem;color:#64748b" th:text="'#' + ${order.id}">-</span>
            </div>
            <ul style="margin:0;padding-left:1.2rem;font-size:.85rem;color:#475569">
                <li th:each="item : ${order.items}"
                    th:text="${item.productName} + ' × ' + ${item.quantity} + ' — $' + ${item.price}">-</li>
            </ul>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
