<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Редактировать профиль — Магазин</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width:600px">
    <h1 class="page-title">Редактировать профиль</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="profile-card">
        <form th:action="@{/profile/edit}" method="post" th:object="${dto}">

            <div class="form-row">
                <div class="form-group">
                    <label>Имя *</label>
                    <input type="text" th:field="*{firstName}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                </div>
                <div class="form-group">
                    <label>Фамилия *</label>
                    <input type="text" th:field="*{lastName}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Страна *</label>
                    <input type="text" th:field="*{country}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></span>
                </div>
                <div class="form-group">
                    <label>Язык *</label>
                    <input type="text" th:field="*{language}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('language')}" th:errors="*{language}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Пол *</label>
                    <select th:field="*{gender}" required>
                        <option value="">Выбрать...</option>
                        <option value="MALE">Мужской</option>
                        <option value="FEMALE">Женский</option>
                        <option value="OTHER">Другой</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                </div>
                <div class="form-group">
                    <label>Возраст *</label>
                    <input type="number" th:field="*{age}" min="1" max="150" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                </div>
            </div>

            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" th:field="*{phone}"/>
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" th:field="*{email}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label>Telegram chat ID</label>
                <input type="text" th:field="*{telegramChatId}" placeholder="напр. 787209390"/>
                <small style="color:#888;font-size:.8rem">
                    Узнать свой chat ID можно через бота
                    <a href="https://t.me/userinfobot" target="_blank" rel="noopener">@userinfobot</a>
                    в Telegram. Нужен для получения уведомлений.
                </small>
                <span class="field-error" th:if="${#fields.hasErrors('telegramChatId')}" th:errors="*{telegramChatId}"></span>
            </div>

            <hr style="margin:1.25rem 0;border-color:#e2e8f0"/>
            <h3 style="font-size:1rem;color:#555;margin-bottom:1rem">Демографические данные <span style="font-weight:400;color:#999">(используются для A/B тестов)</span></h3>

            <div class="form-row">
                <div class="form-group">
                    <label>Уровень дохода</label>
                    <select th:field="*{incomeLevel}">
                        <option value="">Не указан</option>
                        <option value="LOW">Низкий</option>
                        <option value="MEDIUM">Средний</option>
                        <option value="HIGH">Высокий</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Образование</label>
                    <select th:field="*{educationLevel}">
                        <option value="">Не указано</option>
                        <option value="BASIC">Начальное</option>
                        <option value="SECONDARY">Среднее</option>
                        <option value="HIGHER">Высшее</option>
                        <option value="ACADEMIC">Аспирантура</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Занятость</label>
                <select th:field="*{occupation}">
                    <option value="">Не указана</option>
                    <option value="STUDENT">Студент</option>
                    <option value="EMPLOYED">Работающий</option>
                    <option value="SELF_EMPLOYED">Самозанятый</option>
                    <option value="UNEMPLOYED">Безработный</option>
                    <option value="RETIRED">Пенсионер</option>
                </select>
            </div>

            <div class="form-group">
                <label>Интересы <span style="font-weight:400;color:#999">(через запятую)</span></label>
                <input type="text" th:field="*{interestsRaw}" placeholder="напр. технологии, спорт, музыка"/>
            </div>

            <div style="display:flex;gap:.75rem;margin-top:.5rem">
                <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                <a th:href="@{/profile}" class="btn btn-outline" style="color:#666;border-color:#ced4da">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
