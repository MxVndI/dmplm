<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ошибка — Магазин</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper error-page">
    <div>
        <div class="error-code">&#9888;</div>
        <h2 style="font-size:1.5rem;color:#495057;margin:.5rem 0">Что-то пошло не так</h2>
        <p class="error-msg" th:text="${error != null ? error : 'Произошла непредвиденная ошибка.'}">Сообщение об ошибке</p>
        <div style="margin-top:1.5rem">
            <a th:href="@{/}" class="btn btn-primary">На главную</a>
        </div>
    </div>
</div>
</body>
</html>
