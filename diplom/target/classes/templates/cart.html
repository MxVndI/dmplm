<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Корзина — Магазин</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <style>
        .cart-table td, .cart-table th { padding:.75rem 1rem; }
        .cart-total { font-size:1.5rem; font-weight:800; color:#667eea; }
        .order-history .order-row { background:#fff; border-radius:.6rem; padding:1rem 1.2rem;
                                    margin-bottom:.75rem; box-shadow:0 1px 6px rgba(0,0,0,.06); }
        .order-row__header { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:.5rem; }
        .order-row__id { font-family:monospace; font-size:.8rem; color:#64748b; }
        .order-row__total { font-weight:800; color:#667eea; }
        .order-row__variant { background:#ede9fe; color:#5b21b6; border-radius:2rem;
                              padding:.15rem .6rem; font-size:.75rem; font-weight:700; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width:900px">
    <h1 class="page-title">Ваша корзина</h1>

    <div th:if="${cartError}" class="alert alert-error" th:text="${cartError}"></div>
    <div th:if="${orderSuccess}" class="alert alert-success" th:text="${orderSuccess}"></div>

    <!-- Пустая корзина -->
    <div th:if="${#lists.isEmpty(cartItems)}" style="text-align:center;padding:3rem 1rem">
        <div style="font-size:4rem">🛒</div>
        <p style="font-size:1.1rem;color:#64748b;margin:.75rem 0">Ваша корзина пуста.</p>
        <a th:href="@{/products}" class="btn btn-primary">Перейти в каталог</a>
    </div>

    <!-- Таблица корзины -->
    <div th:unless="${#lists.isEmpty(cartItems)}">
        <div class="table-wrapper">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Цена</th>
                        <th>Количество</th>
                        <th>Сумма</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td th:text="${item.productName()}">-</td>
                        <td th:text="'$' + ${item.price()}">$0</td>
                        <td th:text="${item.quantity()}">1</td>
                        <td th:text="'$' + ${item.subtotal()}">$0</td>
                        <td>
                            <form th:action="@{/cart/remove}" method="post" style="margin:0">
                                <input type="hidden" name="productId" th:value="${item.productId()}"/>
                                <button type="submit" class="btn btn-danger btn-sm"
                                        data-track="remove-from-cart"
                                        th:data-product-id="${item.productId()}"
                                        onclick="return confirm('Удалить из корзины?')">✕</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" style="text-align:right;font-weight:700">Итого:</td>
                        <td class="cart-total" th:text="'$' + ${cartTotal}">$0.00</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:1rem;margin-top:1rem">
            <a th:href="@{/products}" class="btn btn-outline">Продолжить покупки</a>
            <form th:action="@{/cart/checkout}" method="post" style="margin:0"
                  data-track="checkout"
                  th:data-cart-items="${#lists.size(cartItems)}"
                  th:data-cart-total="${cartTotal}">
                <button type="submit" class="btn btn-success"
                        onclick="return confirm('Подтвердить заказ?')">
                    ✅ Оформить заказ — $<span th:text="${cartTotal}">0.00</span>
                </button>
            </form>
        </div>
    </div>

    <div style="margin-top:1rem;text-align:right">
        <a th:href="@{/orders}" class="btn btn-outline">Мои заказы</a>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
