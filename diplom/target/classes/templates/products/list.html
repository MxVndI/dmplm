<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Товары — Магазин</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper">
    <h1 class="page-title">Каталог товаров</h1>

    <form th:action="@{/products}" method="get" class="search-bar">
        <input type="text" name="search" placeholder="Поиск по названию..." th:value="${search}"/>
        <button type="submit" class="btn btn-primary">Найти</button>
        <a th:if="${search != null and !search.isEmpty()}" th:href="@{/products}" class="btn btn-outline" style="color:#666;border-color:#ced4da">Сбросить</a>
    </form>

    <div th:if="${#lists.isEmpty(products)}" class="alert alert-success">
        <span th:if="${search != null and !search.isEmpty()}">По запросу «<strong th:text="${search}"></strong>» товаров не найдено.</span>
        <span th:unless="${search != null and !search.isEmpty()}">Товары ещё не добавлены.</span>
    </div>

    <div class="products-grid" th:unless="${#lists.isEmpty(products)}">
        <div class="product-card" th:each="p : ${products}">
            <a th:href="@{/products/{id}(id=${p.id})}">
                <img th:if="${p.photoUrl != null and !p.photoUrl.isEmpty()}"
                     th:src="${p.photoUrl}" th:alt="${p.name}"/>
                <div class="product-card-no-img" th:unless="${p.photoUrl != null and !p.photoUrl.isEmpty()}">&#128247;</div>
            </a>
            <div class="product-card-body">
                <div class="product-card-name" th:text="${p.name}">Название</div>
                <div class="product-card-price" th:text="'$' + ${p.price}">$0.00</div>
                <div class="product-card-desc" th:text="${p.description}">Описание</div>
                <div class="product-card-qty"
                     th:classappend="${p.availableQuantity == 0} ? 'out' : ''"
                     th:text="${p.availableQuantity > 0} ? 'В наличии: ' + ${p.availableQuantity} + ' шт.' : 'Нет в наличии'">
                </div>
            </div>
            <div class="product-card-footer">
                <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-primary btn-sm btn-full">Подробнее</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
