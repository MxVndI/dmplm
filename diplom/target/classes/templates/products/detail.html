<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${product.name} + ' — Магазин'">Товар</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width:900px">
    <a th:href="@{/products}" style="color:#667eea;font-weight:600;font-size:.9rem">&larr; Назад к каталогу</a>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:1.5rem;background:#fff;border-radius:.75rem;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.1)">

        <!-- Фото -->
        <div>
            <img th:if="${product.photoUrl != null and !product.photoUrl.isEmpty()}"
                 th:src="${product.photoUrl}" th:alt="${product.name}"
                 style="width:100%;height:400px;object-fit:cover"/>
            <div th:unless="${product.photoUrl != null and !product.photoUrl.isEmpty()}"
                 style="height:400px;background:linear-gradient(135deg,#e9ecef,#dee2e6);display:flex;align-items:center;justify-content:center;font-size:5rem;color:#adb5bd">
                &#128247;
            </div>
        </div>

        <!-- Описание -->
        <div style="padding:2rem;display:flex;flex-direction:column;justify-content:center"
             th:attr="data-product-id=${product.id},data-product-name=${product.name},data-product-price=${product.price}">
            <h1 style="font-size:1.75rem;font-weight:800;margin:0 0 .5rem" th:text="${product.name}">Название</h1>
            <div style="font-size:2rem;font-weight:900;color:#667eea;margin-bottom:1rem"
                 th:text="'$' + ${product.price}">$0.00</div>

            <p style="color:#6c757d;line-height:1.6;margin-bottom:1.5rem" th:text="${product.description}">Описание</p>

            <div style="margin-bottom:1.5rem">
                <span th:if="${product.availableQuantity > 0}"
                      style="color:#198754;font-weight:700;font-size:1rem"
                      th:text="'В наличии: ' + ${product.availableQuantity} + ' шт.'">В наличии</span>
                <span th:unless="${product.availableQuantity > 0}"
                      style="color:#dc3545;font-weight:700;font-size:1rem">Нет в наличии</span>
            </div>

            <form th:action="@{/cart/add}" method="post" style="display:flex;gap:.75rem;margin-bottom:1rem"
                  th:if="${product.availableQuantity > 0}">
                <input type="hidden" name="productId" th:value="${product.id}"/>
                <input type="number" name="quantity" value="1" min="1"
                       th:max="${product.availableQuantity}"
                       style="width:70px;padding:.45rem .6rem;border:1.5px solid #ced4da;border-radius:.4rem"/>
                <button type="submit" class="btn btn-success"
                        data-track="add-to-cart"
                        th:data-product-id="${product.id}"
                        th:data-product-name="${product.name}"
                        th:data-product-price="${product.price}">
                    🛒 Добавить в корзину
                </button>
            </form>

            <a th:href="@{/products}" class="btn btn-outline" style="color:#667eea;border-color:#667eea;justify-content:center">
                &larr; Продолжить покупки
            </a>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
