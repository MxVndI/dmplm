<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мой профиль — Магазин (Вариант A)</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <meta name="ab-test-variant" content="A"/>
    <style>
        .profile-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 2rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .profile-hero__avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; flex-shrink: 0;
        }
        .profile-hero__name { font-size: 1.5rem; font-weight: 800; margin: 0; }
        .profile-hero__sub  { opacity: .85; margin: .25rem 0 0; font-size: .9rem; }
        .profile-card-a {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(102,126,234,.15);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .profile-row { display: flex; justify-content: space-between;
            padding: .6rem 0; border-bottom: 1px solid #f0f0f5; }
        .profile-row:last-child { border-bottom: none; }
        .profile-label { color: #888; font-size: .875rem; }
        .profile-value { font-weight: 600; color: #222; }
        .btn-edit-a {
            display: inline-block;
            background: linear-gradient(135deg,#667eea,#764ba2);
            color: #fff; padding: .6rem 1.5rem;
            border-radius: 8px; text-decoration: none;
            font-weight: 700; margin-top: 1rem;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width:680px">

    <!-- Hero banner (Variant A) -->
    <div class="profile-hero">
        <div class="profile-hero__avatar">👤</div>
        <div>
            <p class="profile-hero__name"
               th:text="${user.firstName + ' ' + user.lastName}">Имя Фамилия</p>
            <p class="profile-hero__sub" th:text="'@' + ${user.login}">@login</p>
        </div>
    </div>

    <div th:if="${param.updated}" class="alert alert-success" style="margin-bottom:1rem">
        Профиль успешно обновлён.
    </div>

    <div class="profile-card-a">
        <div class="profile-row">
            <span class="profile-label">Страна</span>
            <span class="profile-value" th:text="${user.country ?: '—'}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Язык</span>
            <span class="profile-value" th:text="${user.language ?: '—'}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Пол</span>
            <span class="profile-value" th:text="${user.gender ?: '—'}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Возраст</span>
            <span class="profile-value" th:text="${user.age ?: '—'}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Телефон</span>
            <span class="profile-value" th:text="${user.phone ?: '—'}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">E-mail</span>
            <span class="profile-value" th:text="${user.email ?: '—'}">—</span>
        </div>
    </div>

    <a th:href="@{/profile/edit}" class="btn-edit-a">✏️ Редактировать профиль</a>
</div>
</body>
</html>
