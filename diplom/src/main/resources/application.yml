spring:
  application:
    name: diplom-shop
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/diplom_shop}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: false
  web:
    resources:
      static-locations: classpath:/static/
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: diplom-shop-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.diplom.*"
        spring.json.value.default.type: com.diplom.event.TestParticipantEvent

server:
  port: ${SERVER_PORT:8080}

app:
  s3:
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:diplom-shop}
    public-url-base: ${S3_PUBLIC_URL:}
  test-service-url: ${TEST_SERVICE_URL:http://localhost:8081}
  test-service-admin-username: ${TEST_SERVICE_ADMIN_USERNAME:admin}
  test-service-admin-password: ${TEST_SERVICE_ADMIN_PASSWORD:}
  default-admin-password: ${DEFAULT_ADMIN_PASSWORD:}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
  demographic-service-url: ${DEMOGRAPHIC_SERVICE_URL:http://localhost:8084}
  assignment-service-url: ${ASSIGNMENT_SERVICE_URL:}
  # Rule-based A/B resolver — points to diplom-test-service (same host as test-service-url)
  ab-rule-service-url: ${AB_RULE_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.diplom: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: diplom-shop
