<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Тест кнопок — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <meta name="ab-test-variant" content="default"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="button-test-page">
    <section class="button-test-card">
        <p class="button-test-kicker">Исследование интерфейса</p>
        <h1>Тест кнопок</h1>

        <a th:href="@{/}" class="btn btn-primary">Вернуться на главную</a>
    </section>
</main>

<script th:src="@{/js/button-test.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
