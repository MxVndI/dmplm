<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Корзина покупок — DiplomShop"/>
    <title>Корзина — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width: 1100px">
    <!-- Header -->
    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem">
        <a th:href="@{/}" style="color: var(--color-secondary); text-decoration: none; font-weight: 600; transition: all var(--duration-fast)"
           onmouseover="this.style.color='var(--color-primary)'"
           onmouseout="this.style.color='var(--color-secondary)'"
           title="Home"></a>
        <h1 class="page-title" style="margin: 0">Корзина</h1>
    </div>

    <!-- Messages -->
    <div th:if="${cartError}" class="alert alert-error" role="alert" th:text="${cartError}"></div>
    <div th:if="${orderSuccess}" class="alert alert-success" role="alert" th:text="${orderSuccess}"></div>

    <!-- Empty Cart -->
    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-state">
        <div class="empty-state__icon">🛒</div>
        <h2 class="empty-state__title">Ваша корзина пуста</h2>
        <p class="empty-state__message">Посмотрите каталог и добавьте товары для покупки</p>
        <a th:href="@{/products}" class="btn btn-primary">Смотреть каталог</a>
    </div>

    <!-- Cart with Items -->
    <div th:unless="${#lists.isEmpty(cartItems)}">
        <!-- Products Table -->
        <div class="table-wrapper" style="margin-bottom: 3rem">
            <table style="width: 100%">
                <thead>
                    <tr style="background: var(--color-muted); border-bottom: 2px solid var(--color-border)">
                        <th style="padding: var(--space-md); text-align: left; font-weight: 600; color: var(--color-primary)">Товар</th>
                        <th style="padding: var(--space-md); text-align: center; font-weight: 600; color: var(--color-primary)">Цена</th>
                        <th style="padding: var(--space-md); text-align: center; font-weight: 600; color: var(--color-primary)">Количество</th>
                        <th style="padding: var(--space-md); text-align: right; font-weight: 600; color: var(--color-primary)">Итого</th>
                        <th style="padding: var(--space-md); text-align: center; font-weight: 600; color: var(--color-primary)"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}" style="border-bottom: 1px solid var(--color-border); transition: background var(--duration-fast)">
                        <!-- Product Name -->
                        <td style="padding: var(--space-md); color: var(--color-primary); font-weight: 600">
                            <span th:text="${item.productName()}">Product</span>
                        </td>

                        <!-- Unit Price -->
                        <td style="padding: var(--space-md); text-align: center; color: var(--color-primary); font-weight: 700; font-family: 'Courier New', monospace">
                            <span th:text="'$' + ${#numbers.formatDecimal(item.price(), 1, 2)}">$0.00</span>
                        </td>

                        <!-- Quantity -->
                        <td style="padding: var(--space-md); text-align: center; color: var(--color-secondary)">
                            <span th:text="${item.quantity()}">1</span> x
                        </td>

                        <!-- Subtotal -->
                        <td style="padding: var(--space-md); text-align: right; color: var(--color-primary); font-weight: 700; font-family: 'Courier New', monospace">
                            <span th:text="'$' + ${#numbers.formatDecimal(item.subtotal(), 1, 2)}">$0.00</span>
                        </td>

                        <!-- Remove Button -->
                        <td style="padding: var(--space-md); text-align: center">
                            <form th:action="@{/cart/remove}" method="post" style="margin: 0">
                                <input type="hidden" name="productId" th:value="${item.productId()}"/>
                                <button type="submit"
                                        class="btn btn-danger btn-sm"
                                        data-track="remove-from-cart"
                                        th:data-product-id="${item.productId()}"
                                        onclick="return confirm('Удалить товар из корзины?')"
                                        th:aria-label="'Удалить ' + ${item.productName()}">
                                    Удалить
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Summary & Checkout -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem">
            <!-- Left: Actions -->
            <div>
                <a th:href="@{/products}" class="btn btn-secondary btn-full" style="margin-bottom: 1rem; min-height: 48px">
                    Продолжить покупки
                </a>
                <a th:href="@{/orders}" class="btn btn-outline btn-full" style="min-height: 48px">
                    Мои заказы
                </a>
            </div>

            <!-- Right: Totals & Checkout -->
            <div style="display: flex; flex-direction: column; gap: 1.5rem">
                <!-- Summary Box -->
                <div style="padding: 2rem; background: var(--color-muted); border-radius: var(--radius-lg); border-left: 3px solid var(--color-primary); border: 1px solid var(--color-border)">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem">
                        <span style="font-size: 1.05rem; color: var(--color-secondary); font-weight: 600">Всего товаров:</span>
                        <span style="font-size: 1.2rem; color: var(--color-primary); font-weight: 700" th:text="${#lists.size(cartItems)}">0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 1.5rem 0; border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border)">
                        <span style="font-size: 1.3rem; color: var(--color-primary); font-weight: 700">Итого:</span>
                        <span style="font-size: 2rem; font-weight: 700; color: var(--color-primary); font-family: 'Courier New', monospace" th:text="'$' + ${#numbers.formatDecimal(cartTotal, 1, 2)}">$0.00</span>
                    </div>
                    <p style="margin: 1rem 0 0; font-size: 0.9rem; color: var(--color-secondary)">
                        Доставка рассчитывается при оформлении
                    </p>
                </div>

                <!-- Checkout Form -->
                <form th:action="@{/cart/checkout}" method="post" style="margin: 0"
                      data-track="checkout"
                      th:data-cart-items="${#lists.size(cartItems)}"
                      th:data-cart-total="${cartTotal}">
                    <button type="submit"
                            class="btn btn-primary btn-full"
                            style="font-size: 1.05rem; padding: 1rem; min-height: 50px; margin-bottom: 0.75rem"
                            onclick="return confirm('Подтвердить заказ на $' + document.querySelector('[data-cart-total]').getAttribute('data-cart-total') + '?')"
                            th:aria-label="'Оформить заказ на $' + ${#numbers.formatDecimal(cartTotal, 1, 2)}">
                        Оформить заказ
                    </button>
                </form>

                <p style="text-align: center; font-size: 0.85rem; color: var(--color-secondary)">
                    Безопасное и зашифрованное оформление
                </p>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
