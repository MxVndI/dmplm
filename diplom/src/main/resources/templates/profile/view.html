<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width: 700px">
    <h1 class="page-title">My Profile</h1>

    <div th:if="${param.updated}" class="alert alert-success">Profile updated successfully.</div>

    <div class="profile-card">

        <div class="profile-row">
            <span class="profile-label">Username</span>
            <span class="profile-value" th:text="${user.login}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">First Name</span>
            <span class="profile-value" th:text="${user.firstName}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Last Name</span>
            <span class="profile-value" th:text="${user.lastName}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Country</span>
            <span class="profile-value" th:text="${user.country}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Language</span>
            <span class="profile-value" th:text="${user.language}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Gender</span>
            <span class="profile-value" th:text="${user.gender}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Age</span>
            <span class="profile-value" th:text="${user.age}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Phone</span>
            <span class="profile-value" th:text="${user.phone != null ? user.phone : '—'}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Email</span>
            <span class="profile-value" th:text="${user.email}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Telegram Chat ID</span>
            <span class="profile-value" th:text="${user.telegramChatId != null and !user.telegramChatId.isEmpty() ? user.telegramChatId : '—'}">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Joined</span>
            <span class="profile-value" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">—</span>
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem">
            <a th:href="@{/profile/edit}" class="btn btn-primary" style="flex: 1">Edit Profile</a>
            <a th:href="@{/orders}" class="btn btn-secondary" style="flex: 1">View Orders</a>
        </div>
    </div>
</div>
</body>
</html>
