<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Profile — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width: 700px">
    <h1 class="page-title">Edit Profile</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="profile-card">
        <form th:action="@{/profile/edit}" method="post" th:object="${dto}">

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name <span style="color: var(--color-error)">*</span></label>
                    <input type="text" id="firstName" th:field="*{firstName}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name <span style="color: var(--color-error)">*</span></label>
                    <input type="text" id="lastName" th:field="*{lastName}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="country">Country <span style="color: var(--color-error)">*</span></label>
                    <input type="text" id="country" th:field="*{country}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></span>
                </div>
                <div class="form-group">
                    <label for="language">Language <span style="color: var(--color-error)">*</span></label>
                    <input type="text" id="language" th:field="*{language}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('language')}" th:errors="*{language}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="gender">Gender <span style="color: var(--color-error)">*</span></label>
                    <select id="gender" th:field="*{gender}" required>
                        <option value="">Select...</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                </div>
                <div class="form-group">
                    <label for="age">Age <span style="color: var(--color-error)">*</span></label>
                    <input type="number" id="age" th:field="*{age}" min="1" max="150" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" th:field="*{phone}"/>
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label for="email">Email <span style="color: var(--color-error)">*</span></label>
                <input type="email" id="email" th:field="*{email}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="telegramChatId">Telegram Chat ID</label>
                <input type="text" id="telegramChatId" th:field="*{telegramChatId}" placeholder="e.g. 787209390"/>
                <small style="color: var(--color-secondary); font-size: 0.8rem; display: block; margin-top: 0.5rem">
                    Get your chat ID from <a href="https://t.me/userinfobot" target="_blank" rel="noopener" style="color: var(--color-primary)">@userinfobot</a> on Telegram
                </small>
                <span class="field-error" th:if="${#fields.hasErrors('telegramChatId')}" th:errors="*{telegramChatId}"></span>
            </div>

            <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--color-border)"/>
            <h3 style="font-size: 1rem; color: var(--color-primary); margin-bottom: 1rem; font-weight: 600">Demographics <span style="font-weight: 400; color: var(--color-secondary); font-size: 0.9rem">(For A/B testing)</span></h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="incomeLevel">Income Level</label>
                    <select id="incomeLevel" th:field="*{incomeLevel}">
                        <option value="">Not specified</option>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="educationLevel">Education</label>
                    <select id="educationLevel" th:field="*{educationLevel}">
                        <option value="">Not specified</option>
                        <option value="BASIC">Basic</option>
                        <option value="SECONDARY">Secondary</option>
                        <option value="HIGHER">Higher</option>
                        <option value="ACADEMIC">Graduate</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="occupation">Occupation</label>
                <select id="occupation" th:field="*{occupation}">
                    <option value="">Not specified</option>
                    <option value="STUDENT">Student</option>
                    <option value="EMPLOYED">Employed</option>
                    <option value="SELF_EMPLOYED">Self-employed</option>
                    <option value="UNEMPLOYED">Unemployed</option>
                    <option value="RETIRED">Retired</option>
                </select>
            </div>

            <div class="form-group">
                <label for="interestsRaw">Interests <span style="font-weight: 400; color: var(--color-secondary); font-size: 0.9rem">(Comma-separated)</span></label>
                <input type="text" id="interestsRaw" th:field="*{interestsRaw}" placeholder="e.g. technology, sports, music"/>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 2rem">
                <button type="submit" class="btn btn-primary" style="flex: 1; min-height: 48px">Save Changes</button>
                <a th:href="@{/profile}" class="btn btn-secondary" style="flex: 1; min-height: 48px">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
