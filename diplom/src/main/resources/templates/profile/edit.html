<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Редактирование профиля — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width: 700px">
    <h1 class="page-title">Редактирование профиля</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="profile-card">
        <form th:action="@{/profile/edit}" method="post" th:object="${dto}">

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Имя <span style="color: var(--color-error)">*</span></label>
                    <input type="text" id="firstName" th:field="*{firstName}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                </div>
                <div class="form-group">
                    <label for="lastName">Фамилия <span style="color: var(--color-error)">*</span></label>
                    <input type="text" id="lastName" th:field="*{lastName}" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="country">Страна</label>
                    <input type="text" id="country" th:field="*{country}"/>
                    <span class="field-error" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></span>
                </div>
                <div class="form-group">
                    <label for="language">Язык</label>
                    <input type="text" id="language" th:field="*{language}"/>
                    <span class="field-error" th:if="${#fields.hasErrors('language')}" th:errors="*{language}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="gender">Пол</label>
                    <select id="gender" th:field="*{gender}">
                        <option value="">Не указано</option>
                        <option value="MALE">Мужской</option>
                        <option value="FEMALE">Женский</option>
                        <option value="OTHER">Другое</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                </div>
                <div class="form-group">
                    <label for="age">Возраст</label>
                    <input type="number" id="age" th:field="*{age}" min="1" max="150"/>
                    <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" th:field="*{phone}"/>
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label for="email">Электронная почта <span style="color: var(--color-error)">*</span></label>
                <input type="email" id="email" th:field="*{email}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="telegramChatId">ID чата Telegram</label>
                <input type="text" id="telegramChatId" th:field="*{telegramChatId}" placeholder="например, 787209390"/>
                <small style="color: var(--color-secondary); font-size: 0.8rem; display: block; margin-top: 0.5rem">
                    Получить ID чата можно через <a href="https://t.me/userinfobot" target="_blank" rel="noopener" style="color: var(--color-primary)">@userinfobot</a> в Telegram
                </small>
                <span class="field-error" th:if="${#fields.hasErrors('telegramChatId')}" th:errors="*{telegramChatId}"></span>
            </div>

            <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--color-border)"/>
            <h3 style="font-size: 1rem; color: var(--color-primary); margin-bottom: 1rem; font-weight: 600">Демография <span style="font-weight: 400; color: var(--color-secondary); font-size: 0.9rem">(для A/B-тестирования)</span></h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="incomeLevel">Уровень дохода</label>
                    <select id="incomeLevel" th:field="*{incomeLevel}">
                        <option value="">Не указано</option>
                        <option value="LOW">Низкий</option>
                        <option value="MEDIUM">Средний</option>
                        <option value="HIGH">Высокий</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="educationLevel">Образование</label>
                    <select id="educationLevel" th:field="*{educationLevel}">
                        <option value="">Не указано</option>
                        <option value="BASIC">Базовое</option>
                        <option value="SECONDARY">Среднее</option>
                        <option value="HIGHER">Высшее</option>
                        <option value="ACADEMIC">Академическое</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="occupation">Занятость</label>
                <select id="occupation" th:field="*{occupation}">
                    <option value="">Не указано</option>
                    <option value="STUDENT">Студент</option>
                    <option value="EMPLOYED">Работает</option>
                    <option value="SELF_EMPLOYED">Самозанятый</option>
                    <option value="UNEMPLOYED">Безработный</option>
                    <option value="RETIRED">Пенсионер</option>
                </select>
            </div>

            <div class="form-group">
                <label for="interestsRaw">Интересы <span style="font-weight: 400; color: var(--color-secondary); font-size: 0.9rem">(через запятую)</span></label>
                <input type="text" id="interestsRaw" th:field="*{interestsRaw}" placeholder="например: технологии, спорт, музыка"/>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 2rem">
                <button type="submit" class="btn btn-primary" style="flex: 1; min-height: 48px">Сохранить изменения</button>
                <a th:href="@{/profile}" class="btn btn-secondary" style="flex: 1; min-height: 48px">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
