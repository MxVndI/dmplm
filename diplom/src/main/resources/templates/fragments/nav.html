<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Navigation Bar -->
<nav th:fragment="navbar" class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
        <a th:href="@{/}" class="navbar-brand">DiplomShop</a>
        <ul class="navbar-links">
            <li><a th:href="@{/}" title="Главная">Главная</a></li>
            <li><a th:href="@{/products}" title="Каталог товаров">Каталог</a></li>

            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/profile}" title="Профиль пользователя">
                    <span sec:authentication="name" style="font-weight: var(--font-weight-semibold)"></span>
                </a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/products}" title="Управление товарами">
                    Товары <span class="nav-badge">Т</span>
                </a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/config-tests}" title="A/B тестирование">
                    Тесты <span class="nav-badge">Т</span>
                </a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/metrics}" title="Аналитика">
                    Аналитика <span class="nav-badge">А</span>
                </a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/notifications}" title="Уведомления">
                    Уведомления <span class="nav-badge">У</span>
                </a>
            </li>

            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/cart}" title="Корзина покупок">
                    Корзина <span class="nav-badge" id="cart-count-badge"
                        th:text="${_cartCount != null ? _cartCount : 0}">0</span>
                </a>
            </li>

            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/orders}" title="Мои заказы">Заказы</a>
            </li>

            <li sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}" class="btn btn-primary btn-sm" title="Вход">Вход</a>
            </li>

            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/auth/logout}" method="post" style="margin: 0; display: inline">
                    <button type="submit" class="btn btn-secondary btn-sm" title="Выход" aria-label="Выход">Выход</button>
                </form>
            </li>
        </ul>
    </div>

    <!--/* Inject tracking context for main.js — never visible to the user */-->
    <script th:inline="javascript">
    window.__tracking = {
        userId:  /*[[${_trackUserId}]]*/ null,
        testId:  /*[[${_trackTestId}]]*/ null,
        variant: /*[[${_trackVariant}]]*/ null
    };
    </script>
</nav>

</body>
</html>
