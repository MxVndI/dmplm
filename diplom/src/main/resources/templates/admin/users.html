<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Пользователи — Админ</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper">
    <h1 class="page-title">Управление пользователями</h1>
    <div th:if="${param.blocked}" class="alert alert-success">Пользователь заблокирован.</div>
    <div th:if="${param.unblocked}" class="alert alert-success">Пользователь разблокирован.</div>

    <form th:action="@{/admin/users}" method="get" class="search-bar">
        <input type="text" name="search" placeholder="Поиск по логину, имени или email..." th:value="${search}"/>
        <button type="submit" class="btn btn-primary">Найти</button>
        <a th:if="${search != null and !search.isEmpty()}" th:href="@{/admin/users}"
           class="btn btn-outline" style="color:#666;border-color:#ced4da">Сбросить</a>
    </form>

    <div class="admin-section">
        <h3>Пользователи (<span th:text="${#lists.size(users)}">0</span>)</h3>

        <div th:if="${#lists.isEmpty(users)}" class="text-muted">Пользователи не найдены.</div>

        <div class="table-wrapper" th:unless="${#lists.isEmpty(users)}">
            <table>
                <thead>
                    <tr>
                        <th>Логин</th>
                        <th>Полное имя</th>
                        <th>Email</th>
                        <th>Страна</th>
                        <th>Возраст</th>
                        <th>Пол</th>
                        <th>Роли</th>
                        <th>Статус</th>
                        <th>Дата регистрации</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td style="font-weight:600" th:text="${u.login}">-</td>
                        <td th:text="${u.firstName + ' ' + u.lastName}">-</td>
                        <td th:text="${u.email}">-</td>
                        <td th:text="${u.country}">-</td>
                        <td th:text="${u.age}">-</td>
                        <td th:text="${u.gender}">-</td>
                        <td>
                            <span th:each="role : ${u.roles}"
                                  class="badge"
                                  th:classappend="${role.contains('ADMIN')} ? 'badge-active' : 'badge-inactive'"
                                  th:text="${role.replace('ROLE_', '')}"
                                  style="margin-right:.25rem">-</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.blocked} ? 'badge-inactive' : 'badge-active'"
                                  th:text="${u.blocked} ? 'Заблокирован' : 'Активен'">-</span>
                        </td>
                        <td th:text="${#temporals.format(u.createdAt, 'dd.MM.yyyy')}">-</td>
                        <td>
                            <form th:if="${!u.blocked}" th:action="@{/admin/users/{id}/block(id=${u.id})}" method="post" style="margin:0">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Заблокировать пользователя?')">Блокировать</button>
                            </form>
                            <form th:if="${u.blocked}" th:action="@{/admin/users/{id}/unblock(id=${u.id})}" method="post" style="margin:0">
                                <button type="submit" class="btn btn-success btn-sm">Разблокировать</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div style="margin-top:1rem">
        <a th:href="@{/admin/ab-tests}" class="btn btn-primary">A/B Тесты</a>
        <a th:href="@{/admin/products}" class="btn btn-outline" style="margin-left:.5rem;color:#666;border-color:#ced4da">Товары</a>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
