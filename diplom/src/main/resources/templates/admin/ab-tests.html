<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>A/B Тесты — Админ</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <style>
        .id-cell { font-family:monospace; font-size:.78rem; color:#64748b; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:default; }
        .copy-btn { background:none; border:none; cursor:pointer; color:#94a3b8; font-size:.85rem; padding:0 .25rem; }
        .copy-btn:hover { color:#667eea; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper">
    <h1 class="page-title">Управление A/B тестами</h1>

    <div th:if="${param.error}" class="alert alert-error">Ошибка: <span th:text="${param.error}"></span></div>

    <!-- Создать тест -->
    <div class="admin-section">
        <h3>Создать новый тест</h3>
        <form th:action="@{/admin/ab-tests/create}" method="post" style="display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap">
            <div class="form-group" style="margin:0;flex:1;min-width:200px">
                <label>Название теста *</label>
                <input type="text" name="name" placeholder="Например: Тест макета главной страницы" required/>
            </div>
            <div class="form-group" style="margin:0;flex:2;min-width:250px">
                <label>Описание</label>
                <input type="text" name="description" placeholder="Что именно тестируем?"/>
            </div>
            <div class="form-group" style="margin:0;min-width:220px">
                <label>Дата окончания (необязательно)</label>
                <input type="datetime-local" name="expiresAt"/>
            </div>
            <button type="submit" class="btn btn-success">Создать тест</button>
        </form>
    </div>

    <!-- Список тестов -->
    <div class="admin-section">
        <h3>Все тесты</h3>
        <div th:if="${#lists.isEmpty(tests)}" class="text-muted">Тесты ещё не созданы.</div>

        <div class="table-wrapper" th:unless="${#lists.isEmpty(tests)}">
            <table>
                <thead>
                    <tr>
                        <th>ID теста</th>
                        <th>Название</th>
                        <th>Описание</th>
                        <th>Статус</th>
                        <th>Создан</th>
                        <th>Истекает</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="test : ${tests}">
                        <td>
                            <span class="id-cell" th:title="${test.id}" th:text="${test.id}">-</span>
                            <button class="copy-btn" th:data-id="${test.id}" onclick="copyId(this)" title="Скопировать ID">📋</button>
                        </td>
                        <td th:text="${test.name}">-</td>
                        <td th:text="${test.description}">-</td>
                        <td>
                            <span class="badge" th:classappend="${test.active} ? 'badge-active' : 'badge-inactive'"
                                  th:text="${test.active} ? 'Активен' : 'Остановлен'">-</span>
                        </td>
                        <td th:text="${#temporals.format(test.createdAt, 'dd.MM.yyyy')}">-</td>
                        <td>
                            <span th:if="${test.expiresAt != null}"
                                  th:text="${#temporals.format(test.expiresAt,'dd.MM.yyyy HH:mm')}"
                                  th:style="${test.expiresAt.isBefore(#temporals.createNow())} ? 'color:#dc2626;font-weight:700' : ''">—</span>
                            <span th:unless="${test.expiresAt != null}" style="color:#94a3b8">—</span>
                        </td>
                        <td style="display:flex;gap:.5rem;flex-wrap:wrap">
                            <a th:href="@{/admin/templates(testId=${test.id})}" class="btn btn-outline btn-sm">
                                Шаблоны
                            </a>
                            <a th:href="@{/admin/ab-tests/{id}/participants(id=${test.id})}" class="btn btn-primary btn-sm">
                                Участники
                            </a>
                            <a th:href="@{/admin/metrics/test/{id}(id=${test.id})}" class="btn btn-outline btn-sm">
                                Метрики
                            </a>
                            <form th:if="${test.active}"
                                  th:action="@{/admin/ab-tests/{id}/deactivate(id=${test.id})}"
                                  method="post" style="margin:0">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Остановить тест и удалить всех участников?')">Остановить</button>
                            </form>
                            <form th:action="@{/admin/ab-tests/{id}/delete(id=${test.id})}"
                                  method="post" style="margin:0">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Удалить тест и ВСЕ данные участников?')">Удалить</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Добавить пользователя в тест -->
    <div class="admin-section">
        <h3>Добавить пользователя в тест</h3>
        <form id="enrollForm" th:action="@{/admin/ab-tests/__${tests[0]?.id}__/enroll}" method="post"
              style="display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap"
              th:if="${!#lists.isEmpty(tests)}">
            <div class="form-group" style="margin:0;flex:1">
                <label>Тест</label>
                <select name="testIdOverride" id="enrollTestId" style="width:100%;padding:.55rem .8rem;border:1.5px solid #ced4da;border-radius:.4rem">
                    <option th:each="t : ${tests}" th:if="${t.active}"
                            th:value="${t.id}" th:text="${t.name}">-</option>
                </select>
            </div>
            <div class="form-group" style="margin:0;flex:2">
                <label>Пользователь</label>
                <select name="userId" style="width:100%;padding:.55rem .8rem;border:1.5px solid #ced4da;border-radius:.4rem">
                    <option value="">-- выбрать пользователя --</option>
                    <option th:each="u : ${allUsers}"
                            th:value="${u.id}"
                            th:text="${u.login + ' (' + u.firstName + ' ' + u.lastName + ')'}">-</option>
                </select>
            </div>
            <div class="form-group" style="margin:0;min-width:160px">
                <label>Вариант</label>
                <select name="variant" style="width:100%;padding:.55rem .8rem;border:1.5px solid #ced4da;border-radius:.4rem">
                    <option value="">Авто (случайный)</option>
                    <option value="A">A — Яркий дизайн</option>
                    <option value="B">B — Минималистичный дизайн</option>
</select>
            </div>
            <button type="submit" class="btn btn-success" id="enrollBtn">Добавить</button>
        </form>
        <p class="text-muted" style="font-size:.8rem;margin-top:.5rem" th:if="${#lists.isEmpty(tests)}">
            Сначала создайте тест.
        </p>
    </div>
</div>

<script>
function copyId(btn) {
    var id = btn.dataset.id;
    navigator.clipboard.writeText(id).then(function() {
        btn.textContent = '✅';
        setTimeout(function() { btn.textContent = '📋'; }, 1500);
    });
}
document.addEventListener('DOMContentLoaded', function () {
    var selectTest = document.getElementById('enrollTestId');
    if (!selectTest) return;
    var form = document.getElementById('enrollForm');
    function updateAction() {
        var testId = selectTest.value;
        if (testId) form.action = '/admin/ab-tests/' + testId + '/enroll';
    }
    selectTest.addEventListener('change', updateAction);
    updateAction();
});
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
