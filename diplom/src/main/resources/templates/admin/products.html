<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Товары — Админ</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper">
    <h1 class="page-title">Управление товарами</h1>

    <div th:if="${param.created}" class="alert alert-success">Товар успешно создан.</div>
    <div th:if="${param.updated}" class="alert alert-success">Товар успешно обновлён.</div>
    <div th:if="${param.deleted}" class="alert alert-success">Товар удалён.</div>

    <!-- Форма добавления товара -->
    <div class="admin-section">
        <h3>Добавить новый товар</h3>
        <form th:action="@{/admin/products}" method="post" enctype="multipart/form-data"
              th:object="${dto}" style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem 1.5rem">

            <div class="form-group">
                <label>Название *</label>
                <input type="text" th:field="*{name}" required placeholder="Название товара"/>
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="form-group">
                <label>Цена ($) *</label>
                <input type="number" th:field="*{price}" step="0.01" min="0.01" required placeholder="9.99"/>
                <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>

            <div class="form-group" style="grid-column:1/-1">
                <label>Описание</label>
                <textarea th:field="*{description}" rows="3" placeholder="Описание товара..."></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="form-group">
                <label>Количество на складе *</label>
                <input type="number" th:field="*{availableQuantity}" min="0" required placeholder="100"/>
                <span class="field-error" th:if="${#fields.hasErrors('availableQuantity')}" th:errors="*{availableQuantity}"></span>
            </div>

            <div class="form-group">
                <label>Фото (JPG/PNG, макс. 10 МБ)</label>
                <input type="file" name="photo" accept="image/*"/>
            </div>

            <div style="grid-column:1/-1">
                <button type="submit" class="btn btn-success">Добавить товар</button>
            </div>
        </form>
    </div>

    <!-- Таблица товаров -->
    <div class="admin-section">
        <h3>Все товары (<span th:text="${#lists.size(products)}">0</span>)</h3>

        <div th:if="${#lists.isEmpty(products)}" class="text-muted">Товаров пока нет.</div>

        <div class="table-wrapper" th:unless="${#lists.isEmpty(products)}">
            <table>
                <thead>
                    <tr>
                        <th>Фото</th>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Кол-во</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td>
                            <img th:if="${p.photoKey != null and !p.photoKey.isEmpty()}"
                                 th:src="@{'/images/' + ${p.photoKey}}" th:alt="${p.name}"
                                 style="width:60px;height:60px;object-fit:cover;border-radius:.3rem"/>
                            <span th:unless="${p.photoKey != null and !p.photoKey.isEmpty()}" class="text-muted">—</span>
                        </td>
                        <td>
                            <a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}" style="color:#667eea;font-weight:600">-</a>
                        </td>
                        <td th:text="'$' + ${p.price}">-</td>
                        <td>
                            <span th:classappend="${p.availableQuantity == 0} ? 'text-danger' : 'text-success'"
                                  th:text="${p.availableQuantity}">-</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-primary btn-sm"
                               style="margin-right:.35rem">Редактировать</a>
                            <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" style="margin:0">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Удалить этот товар?')">Удалить</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div style="margin-top:1rem">
        <a th:href="@{/admin/ab-tests}" class="btn btn-primary">A/B Тесты</a>
        <a th:href="@{/admin/users}" class="btn btn-outline" style="margin-left:.5rem;color:#666;border-color:#ced4da">Пользователи</a>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
