<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Демография — Админ</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <meta id="csrf-token"  th:content="${_csrf.token}"      content=""/>
    <meta id="csrf-header" th:content="${_csrf.headerName}" content="X-CSRF-TOKEN"/>
    <style>
        #toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;background:#1e1e2e;color:#fff;padding:.75rem 1.25rem;border-radius:.5rem;font-size:.9rem;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div id="toast"></div>

<div class="page-wrapper">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem">
        <div>
            <h1 class="page-title" style="margin:0">Демографические данные</h1>
            <p style="color:#64748b;margin:.25rem 0 0">Расширенные демографические профили пользователей для таргетирования A/B тестов.</p>
        </div>
        <button class="btn btn-outline" style="color:#475569" onclick="loadAll()">&#x21bb; Обновить</button>
    </div>

    <div class="admin-section" style="margin-bottom:1.5rem">
        <h3 style="margin-top:0">Добавить/обновить демографику пользователя</h3>
        <div class="grid">
            <div class="form-group"><label>ID пользователя *</label><input id="f-userId" placeholder="id пользователя магазина"/></div>
            <div class="form-group"><label>Уровень дохода</label><input id="f-income" placeholder="LOW | MEDIUM | HIGH"/></div>
            <div class="form-group"><label>Образование</label><input id="f-education" placeholder="BASIC | SECONDARY | HIGHER | ACADEMIC"/></div>
            <div class="form-group"><label>Занятость</label><input id="f-occupation" placeholder="STUDENT | EMPLOYED | SELF_EMPLOYED ..."/></div>
        </div>
        <div class="form-group" style="margin-top:1rem">
            <label>Интересы (через запятую)</label>
            <input id="f-interests" placeholder="технологии, спорт, мода"/>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:1rem">
            <button class="btn btn-primary" onclick="submitUpsert()">Сохранить</button>
        </div>
    </div>

    <div class="admin-section">
        <h3 style="margin-top:0">Все профили</h3>
        <div id="list"><span class="spinner"></span> Загрузка...</div>
    </div>
</div>

<script>
const API = '/admin/api/proxy/demographics';
const csrfToken  = document.getElementById('csrf-token')?.getAttribute('content');
const csrfHeader = document.getElementById('csrf-header')?.getAttribute('content') || 'X-CSRF-TOKEN';

let toastTimer;
function toast(msg, ok = true) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = ok ? '#1e1e2e' : '#dc3545';
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.style.display = 'none', 3000);
}

async function api(path, method = 'GET', body = null) {
    const headers = { 'Content-Type': 'application/json' };
    if (method !== 'GET') headers[csrfHeader] = csrfToken;
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    if (!res.ok) throw new Error(await res.text());
    const ct = res.headers.get('content-type') || '';
    return ct.includes('application/json') ? res.json() : null;
}

function esc(s) {
    if (s == null) return '—';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadAll() {
    const list = document.getElementById('list');
    list.innerHTML = '<span class="spinner"></span> Загрузка...';
    try {
        const data = await api('');
        if (!data || !data.length) {
            list.innerHTML = '<p class="text-muted">Демографических профилей пока нет.</p>';
            return;
        }
        list.innerHTML = `
            <div class="table-wrapper"><table>
                <thead><tr><th>ID польз.</th><th>Доход</th><th>Образование</th><th>Занятость</th><th>Интересы</th><th>Обновлено</th></tr></thead>
                <tbody>
                    ${data.map(d => `
                    <tr>
                        <td style="font-family:monospace;font-size:.82rem">${esc(d.userId)}</td>
                        <td>${esc(d.incomeLevel)}</td>
                        <td>${esc(d.educationLevel)}</td>
                        <td>${esc(d.occupation)}</td>
                        <td>${(d.interests || []).map(i => `<span class="criteria-pill">${esc(i)}</span>`).join(' ') || '—'}</td>
                        <td>${d.updatedAt ? new Date(d.updatedAt).toLocaleString('ru') : '—'}</td>
                    </tr>`).join('')}
                </tbody>
            </table></div>`;
    } catch (e) {
        list.innerHTML = `<div class="alert alert-error">Ошибка: ${e.message}</div>`;
    }
}

async function submitUpsert() {
    const userId = document.getElementById('f-userId').value.trim();
    if (!userId) { toast('Укажите ID пользователя', false); return; }

    const interestsRaw = document.getElementById('f-interests').value.trim();
    const interests = interestsRaw
        ? interestsRaw.split(',').map(v => v.trim()).filter(Boolean)
        : [];

    const payload = {
        userId,
        incomeLevel: document.getElementById('f-income').value.trim() || null,
        educationLevel: document.getElementById('f-education').value.trim() || null,
        occupation: document.getElementById('f-occupation').value.trim() || null,
        interests
    };

    try {
        await api('', 'POST', payload);
        toast('Сохранено ✓');
        loadAll();
    } catch (e) {
        toast('Ошибка: ' + e.message, false);
    }
}

loadAll();
</script>
</body>
</html>
