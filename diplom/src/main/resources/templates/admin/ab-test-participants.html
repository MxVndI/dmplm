<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Участники теста — Админ</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper">

    <a th:href="@{/admin/ab-tests}" style="color:#667eea;font-weight:600;font-size:.9rem">&larr; Назад к тестам</a>

    <h1 class="page-title" style="margin-top:1rem">
        Участники:
        <span th:text="${test.name}">Тест</span>
        <span class="badge" th:classappend="${test.active} ? 'badge-active' : 'badge-inactive'"
              th:text="${test.active} ? 'Активен' : 'Остановлен'"></span>
    </h1>

    <div th:if="${enrollError}" class="alert alert-error" th:text="${enrollError}"></div>

    <!-- Добавить пользователя -->
    <div class="admin-section">
        <h3>Добавить пользователя</h3>
        <form th:action="@{/admin/ab-tests/{id}/enroll(id=${testId})}" method="post"
              style="display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap">
            <div class="form-group" style="margin:0;flex:2">
                <label>Пользователь</label>
                <select name="userId" required style="width:100%;padding:.55rem .8rem;border:1.5px solid #ced4da;border-radius:.4rem">
                    <option value="">— выбрать пользователя —</option>
                    <option th:each="u : ${allUsers}"
                            th:value="${u.id}"
                            th:text="${u.login + ' (' + u.firstName + ' ' + u.lastName + ')'}">-</option>
                </select>
            </div>
            <div class="form-group" style="margin:0;min-width:160px">
                <label>Вариант</label>
                <select name="variant" style="width:100%;padding:.55rem .8rem;border:1.5px solid #ced4da;border-radius:.4rem">
                    <option value="">Авто (случайно)</option>
                    <option value="A">A — Яркий дизайн</option>
                    <option value="B">B — Минималистичный список</option>
</select>
            </div>
            <button type="submit" class="btn btn-success" th:disabled="${!test.active}">Добавить</button>
        </form>
        <p th:unless="${test.active}" class="text-muted" style="font-size:.8rem;margin-top:.4rem">
            Тест остановлен — добавление участников недоступно.
        </p>
    </div>

    <!-- Таблица участников -->
    <div class="admin-section">
        <h3>Участники (<span th:text="${#lists.size(enrichedParticipations)}">0</span>)</h3>

        <div th:if="${#lists.isEmpty(enrichedParticipations)}" class="text-muted">Пока нет участников.</div>

        <div class="table-wrapper" th:unless="${#lists.isEmpty(enrichedParticipations)}">
            <table>
                <thead>
                    <tr>
                        <th>Логин</th>
                        <th>Полное имя</th>
                        <th>Вариант</th>
                        <th>Добавлен</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${enrichedParticipations}">
                        <td th:text="${entry.user != null ? entry.user.login : entry.participation.userId}">-</td>
                        <td th:text="${entry.user != null ? entry.user.firstName + ' ' + entry.user.lastName : '—'}">-</td>
                        <td>
                            <span class="badge"
                                  th:classappend="'A'.equals(entry.participation.variant) ? 'badge-a' : 'badge-b'"
                                  th:text="'Вариант ' + ${entry.participation.variant}">-</span>
                        </td>
                        <td th:text="${#temporals.format(entry.participation.enrolledAt, 'dd.MM.yyyy HH:mm')}">-</td>
                        <td>
                            <form th:action="@{/admin/ab-tests/participations/{pid}/remove(pid=${entry.participation.id})}"
                                  method="post" style="margin:0">
                                <input type="hidden" name="testId" th:value="${testId}"/>
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Удалить участника?')">Удалить</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
