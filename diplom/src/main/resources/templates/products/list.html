<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Каталог товаров — DiplomShop"/>
    <title>Каталог — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper">
    <!-- Navigation -->
    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem">
        <a th:href="@{/}"
           style="color: var(--color-secondary); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; transition: all var(--duration-fast)"
           onmouseover="this.style.color='var(--color-primary)'"
           onmouseout="this.style.color='var(--color-secondary)'"
           title="На главную">
           Главная
        </a>
        <span style="color: var(--color-border)">/</span>
        <span style="color: var(--color-secondary); font-weight: 600">Каталог</span>
    </div>

    <h1 class="page-title">Каталог товаров</h1>

    <!-- Search & Filters -->
    <form th:action="@{/products}" method="get" class="search-bar">
        <input type="text"
               name="search"
               placeholder="Поиск товаров по названию или описанию..."
               th:value="${search}"
               aria-label="Поиск товаров"/>
        <button type="submit" class="btn btn-primary">Поиск</button>
        <a th:if="${search != null and !search.isEmpty()}"
           th:href="@{/products}"
           class="btn btn-secondary"
           title="Очистить поиск">
           Очистить
        </a>
    </form>

    <!-- Search Status -->
    <div th:if="${search != null and !search.isEmpty()}" style="margin-bottom: 1.5rem; padding: 0.75rem 1rem; background: var(--color-muted); border-radius: var(--radius-md); color: var(--color-primary); font-size: 0.9rem; border-left: 3px solid var(--color-primary)">
        Результаты поиска по запросу "<strong th:text="${search}"></strong>"
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(products)}" class="empty-state">
        <div class="empty-state__icon">📭</div>
        <h3 class="empty-state__title">
            <span th:if="${search != null and !search.isEmpty()}">Товаров не найдено</span>
            <span th:unless="${search != null and !search.isEmpty()}">Каталог пуст</span>
        </h3>
        <p class="empty-state__message">
            <span th:if="${search != null and !search.isEmpty()}">Попробуйте другие ключевые слова или <a th:href="@{/products}" style="color: var(--color-primary); font-weight: 600">просмотрите все товары</a></span>
            <span th:unless="${search != null and !search.isEmpty()}">Проверьте позже, когда появятся новые товары!</span>
        </p>
        <a th:href="@{/}" class="btn btn-secondary">На главную</a>
    </div>

    <!-- Сетка товаров -->
    <div class="products-grid" th:unless="${#lists.isEmpty(products)}">
        <article class="product-card" th:each="p : ${products}" tabindex="0">
            <!-- Изображение товара -->
            <a th:href="@{/products/{id}(id=${p.id})}"
               style="display: block; overflow: hidden; height: 240px"
               th:aria-label="'View product: ' + ${p.name}">
                <img th:if="${p.photoKey != null and !p.photoKey.isEmpty()}"
                     th:src="@{'/images/' + ${p.photoKey}}"
                     th:alt="${p.name}"
                     loading="lazy"
                     style="transition: transform var(--duration-normal) var(--ease-in-out); width: 100%; height: 100%; object-fit: cover"/>
                <div class="product-card-no-img" th:unless="${p.photoKey != null and !p.photoKey.isEmpty()}"></div>
            </a>

            <!-- Информация о товаре -->
            <div class="product-card-body">
                <h3 class="product-card-name" th:text="${p.name}">Название товара</h3>

                <div class="product-card-price" th:text="${#numbers.formatDecimal(p.price, 1, 2)} + ' ₽'">0,00 ₽</div>

                <p class="product-card-desc" th:text="${p.description}">Описание товара</p>

                <div class="product-card-qty"
                     th:classappend="${p.availableQuantity == 0} ? 'out' : ''"
                     th:text="${p.availableQuantity > 0} ? 'В наличии: ' + ${p.availableQuantity} + ' шт.' : 'Нет в наличии'">
                </div>
            </div>

            <!-- Action Button -->
            <div class="product-card-footer">
                <a th:href="@{/products/{id}(id=${p.id})}"
                   class="btn btn-primary btn-sm btn-full"
                   th:aria-label="'Подробнее о товаре ' + ${p.name}">
                   Подробнее
                </a>
            </div>
        </article>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
