<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мои заказы — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width: 1000px">
    <h1 class="page-title">Мои заказы</h1>

    <!-- Пустой список -->
    <div th:if="${orders == null or #lists.isEmpty(orders)}" class="admin-section">
        <p class="text-muted">У вас еще нет заказов</p>
        <a th:href="@{/products}" class="btn btn-primary">Смотреть товары</a>
    </div>

    <!-- Список заказов -->
    <div th:unless="${orders == null or #lists.isEmpty(orders)}" class="order-history">
        <div class="order-row" th:each="order : ${orders}"
             style="background: white; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; transition: all var(--duration-normal); cursor: pointer"
             onmouseover="this.style.boxShadow='var(--shadow-md)'; this.style.borderColor='var(--color-primary)'"
             onmouseout="this.style.boxShadow='var(--shadow-sm)'; this.style.borderColor='var(--color-border)'">

            <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem">
                <span class="badge"
                      style="background-color: white;"
                      th:classappend="${order.status == 'COMPLETED'} ? 'badge-active' : 'badge-inactive'"
                      th:text="${order.status == 'COMPLETED'} ? 'Завершён' : ${order.status}">Статус</span>
                <span style="font-weight: 700; color: var(--color-primary); font-family: 'Courier New', monospace; font-size: 1.1rem; background: white;" th:text="${order.totalPrice} + ' ₽'">0 ₽</span>
                <span style="font-size: 0.85rem; color: var(--color-secondary); background: white;"
                      th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'dd MMM yyyy HH:mm') : ''}">Дата</span>
                <span th:if="${order.variant != null}" class="badge badge-a" style="background-color: white;" th:text="'Вариант ' + ${order.variant}">Вариант</span>
                <span style="font-family: monospace; font-size: 0.8rem; color: var(--color-secondary); margin-left: auto; background: white;" th:text="'Заказ №' + ${order.id}">Заказ №</span>
            </div>

            <ul style="margin: 0; padding-left: 1.5rem; font-size: 0.9rem; color: var(--color-secondary); line-height: 1.7; background: white;">
                <li th:each="item : ${order.items}"
                    th:text="${item.productName} + ' × ' + ${item.quantity} + ' = ' + ${#numbers.formatDecimal(item.price * item.quantity, 1, 2)} + ' ₽'">Товар</li>
            </ul>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
