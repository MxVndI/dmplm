<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Опрос, вариант A — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <meta name="ab-test-variant" content="A"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="button-test-page">
    <section class="button-test-card">
        <p class="button-test-kicker">Вариант A</p>
        <h1>Какая кнопка вам нравится?</h1>
        <p>Выберите цвет, который кажется вам более заметным и приятным для действия.</p>

        <div id="button-test-container" class="button-test-actions">
            <button class="btn-test-red" data-button-id="left" data-button-color="red">Красная</button>
            <button class="btn-test-green" data-button-id="right" data-button-color="green">Зелёная</button>
        </div>

        <div class="button-test-note">
            Сравниваются красная и зелёная кнопки. Нажатие сохранится как результат варианта A.
        </div>
    </section>
</main>

<script th:src="@{/js/button-test.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
