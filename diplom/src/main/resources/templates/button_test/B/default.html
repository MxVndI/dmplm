<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Тест кнопок (Вариант B) — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <meta name="ab-test-variant" content="B"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width: 800px; margin: 5rem auto; text-align: center">
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem; color: #1f2937;">Выберите предпочтение</h1>
    <p style="font-size: 1.1rem; color: #374151; margin-bottom: 3rem">
        Какой цвет вам больше нравится?
    </p>

    <div id="button-test-container" style="display: flex; gap: 3rem; justify-content: center; flex-wrap: wrap; margin: 4rem 0">
        <button class="btn-test-green" data-button-id="left" data-button-color="green">
            Выбрать
        </button>
        <button class="btn-test-purple" data-button-id="right" data-button-color="purple">
            Выбрать
        </button>
    </div>

    <div style="margin-top: 4rem; padding: 2rem; background: var(--color-muted); border-radius: var(--radius-lg)">
        <p style="color: var(--color-secondary); font-size: 0.95rem">
            <strong>Вариант B:</strong> Зелёная vs фиолетовая кнопка
        </p>
    </div>
</div>

<script th:src="@{/js/button-test.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
