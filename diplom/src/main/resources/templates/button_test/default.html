<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Тест кнопок — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <meta name="ab-test-variant" content="default"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width: 800px; margin: 5rem auto; text-align: center">
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem; color: #ffffff;">Тест кнопок</h1>
    <p style="font-size: 1.1rem; color: #ffffff; margin-bottom: 3rem">
        Это страница для тестирования кнопок. Вы не зарегистрированы ни в одном из вариантов теста.
    </p>

    <div style="margin-top: 4rem; padding: 2rem; background: var(--color-muted); border-radius: var(--radius-lg)">
        <p style="color: var(--color-secondary); font-size: 0.95rem">
            <strong>Стандартный вариант:</strong> Вариант не назначен
        </p>
    </div>
</div>

<script th:src="@{/js/button-test.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
