<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Create account on DiplomShop"/>
    <title>Register — DiplomShop</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">
<div class="auth-container" style="max-width: 520px">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 2rem">
            <h1 style="font-size: 2.2rem; margin: 0 0 0.5rem; color: var(--color-primary); font-family: var(--font-heading); font-weight: 700">DiplomShop</h1>
            <p style="margin: 0; color: var(--color-secondary); font-size: 0.95rem">Join our platform</p>
        </div>

        <h2 class="auth-title">Create Account</h2>

        <div th:if="${error}" class="alert alert-error" role="alert" th:text="${error}"></div>

        <form th:action="@{/auth/register}" method="post" th:object="${dto}" novalidate>
            <!-- Basic Information -->
            <fieldset>
                <legend style="font-size: 0.9rem; font-weight: var(--font-weight-semibold); color: var(--color-primary); margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem">Basic Information</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name <span style="color: var(--color-error)">*</span></label>
                        <input type="text" id="firstName" th:field="*{firstName}" placeholder="John" required/>
                        <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name <span style="color: var(--color-error)">*</span></label>
                        <input type="text" id="lastName" th:field="*{lastName}" placeholder="Doe" required/>
                        <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login">Username <span style="color: var(--color-error)">*</span></label>
                    <input type="text" id="login" th:field="*{login}" placeholder="john_doe" required autocomplete="username"/>
                    <span class="field-error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email <span style="color: var(--color-error)">*</span></label>
                    <input type="email" id="email" th:field="*{email}" placeholder="john@example.com" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password <span style="color: var(--color-error)">*</span></label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Min. 8 characters" required autocomplete="new-password"/>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    <small style="color: var(--color-secondary); display: block; margin-top: 0.5rem; font-size: 0.8rem">
                        Requires: uppercase, number, special character
                    </small>
                </div>
            </fieldset>

            <!-- Contact Information -->
            <fieldset style="margin-top: 1.5rem">
                <legend style="font-size: 0.9rem; font-weight: var(--font-weight-semibold); color: var(--color-primary); margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem">Contact (Optional)</legend>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" th:field="*{phone}" placeholder="+1 (555) 123-4567"/>
                    <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" id="country" th:field="*{country}" placeholder="United States"/>
                        <span class="field-error" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></span>
                    </div>
                    <div class="form-group">
                        <label for="language">Language</label>
                        <input type="text" id="language" th:field="*{language}" placeholder="English"/>
                        <span class="field-error" th:if="${#fields.hasErrors('language')}" th:errors="*{language}"></span>
                    </div>
                </div>
            </fieldset>

            <!-- Demographics (Optional) -->
            <fieldset style="margin-top: 1.5rem">
                <legend style="font-size: 0.9rem; font-weight: var(--font-weight-semibold); color: var(--color-primary); margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem">Demographics (Optional)</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" th:field="*{gender}">
                            <option value="">Not specified</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" th:field="*{age}" min="13" max="150" placeholder="25"/>
                        <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                    </div>
                </div>

                <!-- Additional Fields (Expandable) -->
                <details style="cursor: pointer; margin-top: 1rem">
                    <summary style="font-weight: var(--font-weight-semibold); color: var(--color-primary); padding: 0.5rem 0; user-select: none">
                        ▶ Advanced Demographics
                    </summary>
                    <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--color-border)">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="incomeLevel">Income Level</label>
                                <select id="incomeLevel" th:field="*{incomeLevel}">
                                    <option value="">Not specified</option>
                                    <option value="LOW">Low</option>
                                    <option value="MEDIUM">Medium</option>
                                    <option value="HIGH">High</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="educationLevel">Education</label>
                                <select id="educationLevel" th:field="*{educationLevel}">
                                    <option value="">Not specified</option>
                                    <option value="BASIC">Basic</option>
                                    <option value="SECONDARY">Secondary</option>
                                    <option value="HIGHER">Higher</option>
                                    <option value="ACADEMIC">Graduate / PhD</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="occupation">Occupation</label>
                            <select id="occupation" th:field="*{occupation}">
                                <option value="">Not specified</option>
                                <option value="STUDENT">Student</option>
                                <option value="EMPLOYED">Employed</option>
                                <option value="SELF_EMPLOYED">Self-employed</option>
                                <option value="UNEMPLOYED">Unemployed</option>
                                <option value="RETIRED">Retired</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="interestsRaw">Interests</label>
                            <input type="text" id="interestsRaw" th:field="*{interestsRaw}" placeholder="e.g. technology, sports, music"/>
                        </div>
                    </div>
                </details>
            </fieldset>

            <button type="submit" class="btn btn-primary btn-full" style="margin-top: 2rem; min-height: 48px">
                Create Account
            </button>
        </form>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--color-border)">

        <p class="auth-link">
            Already have an account?
            <a th:href="@{/auth/login}">Sign In</a>
        </p>
    </div>
</div>
</body>
</html>
