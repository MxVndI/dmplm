<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мой профиль — Магазин (Вариант B)</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <meta name="ab-test-variant" content="B"/>
    <style>
        .profile-sidebar-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.5rem;
            align-items: start;
        }
        @media (max-width: 640px) {
            .profile-sidebar-layout { grid-template-columns: 1fr; }
        }
        .profile-sidebar {
            background: #1a1a2e;
            color: #fff;
            border-radius: 12px;
            padding: 1.5rem 1rem;
            text-align: center;
        }
        .profile-sidebar__avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg,#ff8906,#f25f4c);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1rem;
        }
        .profile-sidebar__name { font-size: 1.1rem; font-weight: 800; }
        .profile-sidebar__login { color: #aaa; font-size: .8rem; }
        .profile-sidebar__nav   { margin-top: 1.5rem; display: flex; flex-direction: column; gap: .5rem; }
        .profile-sidebar__nav a {
            display: block; padding: .5rem .75rem;
            background: rgba(255,255,255,.07);
            border-radius: 8px; color: #eee;
            text-decoration: none; font-size: .875rem;
        }
        .profile-sidebar__nav a:hover { background: rgba(255,140,6,.25); }
        .profile-main-b {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            padding: 1.5rem;
        }
        .profile-main-b h2 { margin: 0 0 1rem; font-size: 1.2rem; }
        .profile-row { display: flex; justify-content: space-between;
            padding: .6rem 0; border-bottom: 1px solid #f4f4f4; }
        .profile-row:last-child { border-bottom: none; }
        .profile-label { color: #999; font-size: .875rem; }
        .profile-value { font-weight: 600; }
        .btn-edit-b {
            display: inline-block; margin-top: 1rem;
            background: #f25f4c; color: #fff;
            padding: .55rem 1.4rem; border-radius: 8px;
            font-weight: 700; text-decoration: none;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="page-wrapper" style="max-width:860px">

    <div th:if="${param.updated}" class="alert alert-success" style="margin-bottom:1rem">
        Профиль успешно обновлён.
    </div>

    <!-- Two-column layout (Variant B) -->
    <div class="profile-sidebar-layout">

        <!-- Sidebar -->
        <aside class="profile-sidebar">
            <div class="profile-sidebar__avatar">👤</div>
            <div class="profile-sidebar__name"
                 th:text="${user.firstName + ' ' + user.lastName}">Имя Фамилия</div>
            <div class="profile-sidebar__login" th:text="'@' + ${user.login}">@login</div>
            <nav class="profile-sidebar__nav">
                <a th:href="@{/profile}">👤 Профиль</a>
                <a th:href="@{/profile/edit}">✏️ Редактировать</a>
                <a th:href="@{/}">🏠 Главная</a>
                <a th:href="@{/products}">🛍️ Каталог</a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="profile-main-b">
            <h2>Личные данные</h2>
            <div class="profile-row">
                <span class="profile-label">Страна</span>
                <span class="profile-value" th:text="${user.country ?: '—'}">—</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Язык</span>
                <span class="profile-value" th:text="${user.language ?: '—'}">—</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Пол</span>
                <span class="profile-value" th:text="${user.gender ?: '—'}">—</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Возраст</span>
                <span class="profile-value" th:text="${user.age ?: '—'}">—</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Телефон</span>
                <span class="profile-value" th:text="${user.phone ?: '—'}">—</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Электронная почта</span>
                <span class="profile-value" th:text="${user.email ?: '—'}">—</span>
            </div>
            <a th:href="@{/profile/edit}" class="btn-edit-b">✏️ Редактировать профиль</a>
        </main>
    </div>
</div>
</body>
</html>
